<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="on-policy distillation">
  <title>on-policy distillation</title>
  <style>
    .opd-tok    { fill: #7a5cf0; }
    .opd-tok-on { fill: #e35d8b; }
    .opd-bar    { fill: #5b8def; }
    .opd-bar-on { fill: #e35d8b; }
    .opd-tick   { stroke: #6b6b76; stroke-width: 1.5; stroke-linecap: round; }
    .opd-text   { font: 500 18px/1 ui-sans-serif, system-ui, -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #111; letter-spacing: 2px; }
    @media (prefers-color-scheme: dark) {
      .opd-text { fill: #f5f5f7; }
      .opd-tick { stroke: #a7a7b3; }
    }
  </style>

  <!-- Rollout: a left-to-right sequence of emitted tokens.
       The right-most token is "current" (highlighted) — it was sampled from
       the distribution shown directly below it. -->
  <g transform="translate(70,28)">
    <rect class="opd-tok"    x="0"   y="0" width="22" height="14" rx="3"/>
    <rect class="opd-tok"    x="30"  y="0" width="22" height="14" rx="3"/>
    <rect class="opd-tok"    x="60"  y="0" width="22" height="14" rx="3"/>
    <rect class="opd-tok-on" x="90"  y="0" width="22" height="14" rx="3"/>
  </g>

  <!-- Tick: links the current token to the sampled bar in the distribution. -->
  <line class="opd-tick" x1="171" y1="46" x2="171" y2="58"/>

  <!-- Next-token distribution (softmax over vocab).
       Bars rise from a shared baseline; the sampled bar is highlighted. -->
  <g transform="translate(70,60)">
    <rect class="opd-bar"    x="0"   y="32" width="14" height="14" rx="2"/>
    <rect class="opd-bar"    x="20"  y="22" width="14" height="24" rx="2"/>
    <rect class="opd-bar"    x="40"  y="28" width="14" height="18" rx="2"/>
    <rect class="opd-bar"    x="60"  y="14" width="14" height="32" rx="2"/>
    <rect class="opd-bar-on" x="80"  y="0"  width="14" height="46" rx="2"/>
    <rect class="opd-bar"    x="100" y="20" width="14" height="26" rx="2"/>
    <rect class="opd-bar"    x="120" y="34" width="14" height="12" rx="2"/>
    <line class="opd-tick" x1="-4" y1="46" x2="142" y2="46"/>
  </g>

  <!-- Tagline -->
  <text x="160" y="138" text-anchor="middle" class="opd-text">on-policy distillation</text>
</svg>
