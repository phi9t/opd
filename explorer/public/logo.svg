<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-label="on-policy distillation">
  <title>on-policy distillation</title>
  <style>
    .opd-bar    { fill: #5b8def; }
    .opd-bar-on { fill: #e35d8b; }
    .opd-base   { stroke: #6b6b76; stroke-width: 1.25; stroke-linecap: round; }
    .opd-text   { font: 500 18px/1 ui-sans-serif, system-ui, -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif; fill: #111; letter-spacing: 2px; }
    @media (prefers-color-scheme: dark) {
      .opd-text { fill: #f5f5f7; }
      .opd-base { stroke: #a7a7b3; }
    }
  </style>

  <!-- Rollout as a sequence of next-token distributions.
       Each group is a tiny softmax over a vocab slice; the tall pink bar
       is the sampled token at that step. Three groups = three rollout steps.
       Bars share a single baseline running the full width. -->
  <g transform="translate(50,80)">
    <!-- step 1 -->
    <rect class="opd-bar"    x="0"  y="-10" width="8" height="10" rx="1.5"/>
    <rect class="opd-bar"    x="10" y="-18" width="8" height="18" rx="1.5"/>
    <rect class="opd-bar"    x="20" y="-14" width="8" height="14" rx="1.5"/>
    <rect class="opd-bar-on" x="30" y="-40" width="8" height="40" rx="1.5"/>
    <rect class="opd-bar"    x="40" y="-12" width="8" height="12" rx="1.5"/>

    <!-- step 2 -->
    <rect class="opd-bar"    x="70"  y="-12" width="8" height="12" rx="1.5"/>
    <rect class="opd-bar-on" x="80"  y="-38" width="8" height="38" rx="1.5"/>
    <rect class="opd-bar"    x="90"  y="-16" width="8" height="16" rx="1.5"/>
    <rect class="opd-bar"    x="100" y="-14" width="8" height="14" rx="1.5"/>
    <rect class="opd-bar"    x="110" y="-10" width="8" height="10" rx="1.5"/>

    <!-- step 3 -->
    <rect class="opd-bar"    x="140" y="-14" width="8" height="14" rx="1.5"/>
    <rect class="opd-bar"    x="150" y="-12" width="8" height="12" rx="1.5"/>
    <rect class="opd-bar"    x="160" y="-16" width="8" height="16" rx="1.5"/>
    <rect class="opd-bar"    x="170" y="-20" width="8" height="20" rx="1.5"/>
    <rect class="opd-bar-on" x="180" y="-42" width="8" height="42" rx="1.5"/>

    <!-- shared baseline -->
    <line class="opd-base" x1="-4" y1="0" x2="192" y2="0"/>
  </g>

  <!-- Tagline -->
  <text x="160" y="118" text-anchor="middle" class="opd-text">on-policy distillation</text>
</svg>
